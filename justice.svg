<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" role="img" aria-label="정의의 여신과 저울">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8a892"/>
      <stop offset="35%" stop-color="#6b5a48"/>
      <stop offset="70%" stop-color="#3a2e22"/>
      <stop offset="100%" stop-color="#1a130c"/>
    </linearGradient>
    <linearGradient id="bronzeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4c4ac"/>
      <stop offset="45%" stop-color="#8a7660"/>
      <stop offset="100%" stop-color="#3a2e22"/>
    </linearGradient>
    <linearGradient id="bronzeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4a38"/>
      <stop offset="100%" stop-color="#1a130c"/>
    </linearGradient>
    <radialGradient id="headHL" cx="0.35" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#d4c4ac"/>
      <stop offset="100%" stop-color="#5a4a38"/>
    </radialGradient>
  </defs>

  <g stroke="#0a0805" stroke-width="0.8" stroke-linejoin="round">
    <!-- 받침대 (3단) -->
    <rect x="130" y="708" width="160" height="36" fill="#1a130c"/>
    <rect x="115" y="682" width="190" height="28" fill="#2e2418"/>
    <rect x="100" y="666" width="220" height="18" fill="#3e3022"/>
    <rect x="135" y="654" width="150" height="14" fill="url(#bronzeDark)"/>

    <!-- 로브 하단 (드레이프) -->
    <path d="M 148 392 Q 142 490 134 610 L 122 666 L 298 666 L 286 610 Q 278 490 272 392 Q 248 372 210 372 Q 172 372 148 392 Z" fill="url(#bronze)"/>

    <!-- 로브 세로 주름 (그림자) -->
    <g stroke="#0a0805" stroke-width="1.5" fill="none" opacity="0.85">
      <path d="M 162 410 Q 156 530 146 660"/>
      <path d="M 182 410 Q 180 530 174 660"/>
      <path d="M 202 410 Q 202 530 200 660"/>
      <path d="M 218 410 Q 220 530 224 660"/>
      <path d="M 240 410 Q 246 530 258 660"/>
      <path d="M 262 410 Q 270 530 282 660"/>
    </g>
    <!-- 로브 하이라이트 -->
    <g stroke="#a89478" stroke-width="0.7" fill="none" opacity="0.4">
      <path d="M 168 410 Q 164 530 156 660"/>
      <path d="M 192 410 Q 190 530 186 660"/>
      <path d="M 230 410 Q 233 530 240 660"/>
    </g>

    <!-- 허리/엉덩이 곡선 -->
    <path d="M 165 300 Q 210 322 255 300 L 272 392 Q 248 372 210 372 Q 172 372 148 392 Z" fill="url(#bronzeLight)"/>

    <!-- 상체 (가슴부) -->
    <path d="M 170 235 Q 210 220 250 235 L 260 305 Q 210 320 160 305 Z" fill="url(#bronze)"/>
    <!-- 가슴 띠 (sash) -->
    <path d="M 168 256 L 252 290" stroke="#0a0805" stroke-width="4" fill="none"/>
    <path d="M 168 252 L 252 286" stroke="#a89478" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- 목 -->
    <path d="M 196 208 L 224 208 L 226 236 L 194 236 Z" fill="url(#bronzeLight)"/>
    <path d="M 196 218 L 224 218" stroke="#0a0805" stroke-width="0.5" opacity="0.6"/>

    <!-- 머리 -->
    <ellipse cx="210" cy="178" rx="34" ry="42" fill="url(#headHL)"/>
    <!-- 턱선 그림자 -->
    <path d="M 184 188 Q 210 222 236 188" stroke="#0a0805" stroke-width="0.5" fill="none" opacity="0.5"/>

    <!-- 머리카락 -->
    <path d="M 174 168 Q 174 128 210 120 Q 246 128 246 170 Q 254 215 246 240 Q 244 220 246 200 Q 248 175 234 156 Q 210 142 188 156 Q 174 175 176 200 Q 178 220 174 240 Q 166 215 174 168 Z" fill="#0d0a06"/>
    <!-- 머리카락 광택 -->
    <path d="M 188 145 Q 210 132 232 148" stroke="#3a2818" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- 눈가리개 -->
    <rect x="172" y="170" width="78" height="16" fill="#0a0805"/>
    <rect x="172" y="170" width="78" height="3" fill="#2a2218" opacity="0.8"/>
    <!-- 매듭 (옆) -->
    <path d="M 248 178 Q 262 174 268 168 L 264 184 Q 260 188 248 188 Z" fill="#0a0805"/>

    <!-- 코·입 (살짝) -->
    <path d="M 209 192 Q 210 200 212 196" stroke="#3a2818" stroke-width="0.6" fill="none" opacity="0.6"/>
    <path d="M 204 206 Q 210 209 216 206" stroke="#3a2818" stroke-width="0.7" fill="none" opacity="0.6"/>

    <!-- 오른팔 (들어올림, 저울) -->
    <path d="M 250 238 Q 270 215 290 175 Q 306 130 316 95 L 330 98 Q 320 132 304 178 Q 286 222 266 254 Q 256 260 244 254 Z" fill="url(#bronze)"/>
    <!-- 오른팔 하이라이트 -->
    <path d="M 256 240 Q 274 218 292 180" stroke="#a89478" stroke-width="0.8" fill="none" opacity="0.4"/>
    <!-- 오른손 -->
    <ellipse cx="322" cy="98" rx="11" ry="9" fill="url(#bronzeLight)"/>
    <path d="M 314 100 Q 322 106 330 100" stroke="#0a0805" stroke-width="0.6" fill="none" opacity="0.7"/>

    <!-- 왼팔 (검) -->
    <path d="M 170 238 Q 152 285 145 360 Q 142 395 150 415 L 162 415 Q 154 395 158 360 Q 164 285 178 256 Q 184 248 178 242 Z" fill="url(#bronze)"/>
    <path d="M 158 280 Q 152 340 148 400" stroke="#a89478" stroke-width="0.8" fill="none" opacity="0.4"/>
    <!-- 왼손 -->
    <ellipse cx="156" cy="418" rx="11" ry="8" fill="url(#bronzeLight)"/>
  </g>

  <!-- 저울 -->
  <g stroke="#0a0805" stroke-linecap="round">
    <!-- 가로 빔 -->
    <line x1="232" y1="98" x2="402" y2="98" stroke="#1a130c" stroke-width="3.5"/>
    <line x1="232" y1="96" x2="402" y2="96" stroke="#8a7660" stroke-width="1"/>
    <!-- 빔 끝 장식 -->
    <circle cx="232" cy="98" r="4" fill="#3a2e22" stroke="#0a0805" stroke-width="0.8"/>
    <circle cx="402" cy="98" r="4" fill="#3a2e22" stroke="#0a0805" stroke-width="0.8"/>
    <!-- 중앙 고리 (오른손이 잡음) -->
    <circle cx="318" cy="98" r="5.5" fill="#0a0805"/>
    <line x1="318" y1="84" x2="318" y2="92" stroke="#0a0805" stroke-width="2"/>

    <!-- 왼쪽 사슬 (3마디) -->
    <g stroke="#1a130c" stroke-width="1.6" fill="none">
      <path d="M 240 100 L 236 116 L 244 132"/>
      <path d="M 244 132 L 238 148 L 246 162"/>
      <path d="M 246 162 L 240 178"/>
    </g>
    <!-- 오른쪽 사슬 -->
    <g stroke="#1a130c" stroke-width="1.6" fill="none">
      <path d="M 394 100 L 398 116 L 390 132"/>
      <path d="M 390 132 L 396 148 L 388 162"/>
      <path d="M 388 162 L 394 178"/>
    </g>

    <!-- 왼쪽 저울 접시 -->
    <ellipse cx="240" cy="182" rx="40" ry="6.5" fill="#3a2e22" stroke="#0a0805" stroke-width="1.2"/>
    <path d="M 200 182 Q 240 220 280 182 Z" fill="url(#bronzeDark)" stroke="#0a0805" stroke-width="1.2"/>
    <ellipse cx="240" cy="180" rx="38" ry="3" fill="#8a7660" opacity="0.4"/>

    <!-- 오른쪽 저울 접시 -->
    <ellipse cx="394" cy="182" rx="34" ry="5.5" fill="#3a2e22" stroke="#0a0805" stroke-width="1.2"/>
    <path d="M 360 182 Q 394 214 428 182 Z" fill="url(#bronzeDark)" stroke="#0a0805" stroke-width="1.2"/>
    <ellipse cx="394" cy="180" rx="32" ry="2.5" fill="#8a7660" opacity="0.4"/>
  </g>

  <!-- 검 -->
  <g stroke="#0a0805" stroke-width="1">
    <!-- pommel (둥근 끝) -->
    <circle cx="156" cy="414" r="7" fill="url(#bronzeLight)"/>
    <circle cx="154" cy="412" r="2" fill="#d4c4ac" opacity="0.7"/>
    <!-- 손잡이 -->
    <rect x="150" y="421" width="12" height="24" fill="#1a130c"/>
    <line x1="153" y1="423" x2="159" y2="443" stroke="#3a2818" stroke-width="0.5"/>
    <line x1="156" y1="423" x2="156" y2="443" stroke="#3a2818" stroke-width="0.5"/>
    <!-- 십자 가드 -->
    <rect x="126" y="443" width="60" height="10" fill="#3a2e22"/>
    <rect x="126" y="443" width="60" height="3" fill="#8a7660" opacity="0.6"/>
    <!-- 칼날 -->
    <path d="M 148 453 L 164 453 L 161 650 L 156 662 L 151 650 Z" fill="url(#bronzeLight)"/>
    <line x1="156" y1="455" x2="156" y2="648" stroke="#0a0805" stroke-width="0.7"/>
    <!-- 칼날 광택 -->
    <line x1="153" y1="460" x2="153" y2="640" stroke="#d4c4ac" stroke-width="0.5" opacity="0.5"/>
  </g>
</svg>
